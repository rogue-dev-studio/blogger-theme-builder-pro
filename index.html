                        .layout-widget:hover .layout-widget-actions, .layout-widget.is-selected .layout-widget-actions { opacity: 1; }
                        .layout-mini { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #dadce0; background-color: #ffffff; border-radius: 5px; color: #5f6368; font-size: 10px; cursor: pointer; }
                        .layout-mini:hover:not(:disabled) { background-color: #f1f3f4; color: #202124; }
                        .layout-mini:disabled { opacity: .35; cursor: default; }
                        .layout-mini-danger:hover:not(:disabled) { background-color: #fce8e6; border-color: #f6aea9; color: #c5221f; }
                        .layout-empty { padding: 18px 14px; font-size: 11px; color: #80868b; text-align: center; }
                        .layout-hint { margin-top: 14px; font-size: 10px; color: #5f6368; text-align: center; }
                        @container (min-width: 601px) {
                            .layout-row.content-container { grid-template-columns: ${this.buildContentColumns()}; }
                            .layout-col-main.posts-col { padding: 0 var(--column-space); order: 0; }
                            .layout-col-side.sidebar-left-col, .layout-col-side.sidebar-right-col, .layout-col-side.sidebar-col { order: 0; }
                        }
                    </style>
                    <div class="layout-frame"><div class="layout-shell">
                        <div class="layout-topbar">
                            <div>
                                <h1 class="layout-title"><i class="fa-solid fa-table-columns"></i> Layout</h1>
                                <p class="layout-subtitle">${escapeHtml(this.schema.metadata.name)} &#183; ${this.schema.sections.length} sections &#183; ${widgetCount} gadgets</p>
                            </div>
                            <span class="layout-pill">Blogger Layout</span>
                        </div>
                        <div class="layout-sections">
                `;

                this.schema.sections.forEach((sec) => {
                    if (this.isSidebarType(sec.type) && hasMainSection) return;

                    if (sec.type === 'main' && hasSidebarSections && !columnsRendered) {
                        columnsRendered = true;
                        html += `<div class="layout-row content-container">`;
                        if (leftSidebarSections.length) {
                            html += `<div class="layout-col-side sidebar-left-col">`;
                            leftSidebarSections.forEach((sidebarSec) => {
                                html += this.renderLayoutSection(sidebarSec);
                            });
                            html += `</div>`;
                        }
                        html += `<div class="layout-col-main posts-col">${this.renderLayoutSection(sec)}</div>`;
                        if (rightSidebarSections.length) {
                            html += `<div class="layout-col-side sidebar-right-col">`;
                            rightSidebarSections.forEach((sidebarSec) => {
                                html += this.renderLayoutSection(sidebarSec);
                            });
                            html += `</div>`;
                        }
                        html += `</div>`;
                        return;
                    }

                    html += this.renderLayoutSection(sec);
                });

                html += `
                        </div>
                        <p class="layout-hint">Click a gadget to edit it in the inspector. Use the arrows to reorder, or “Add a Gadget” to drop a new one into a section.</p>
                    </div></div>
                `;
                return html;
            }

            renderLayoutSection(sec) {
                const label = SECTION_TYPE_LABELS[sec.type] || sec.type;
                const widgets = sec.widgets.length
                    ? sec.widgets.map((widget, index) => this.renderLayoutWidget(sec, widget, index)).join('')
                    : `<div class="layout-empty">No gadgets yet — use “Add a Gadget” to drop one in.</div>`;
                return `<div class="layout-section section-wrap section-${sec.type}" data-section-id="${escapeHtml(sec.id)}">
                    <div class="layout-section-head">
                        <div class="layout-section-title">
                            <span class="layout-section-label">${escapeHtml(sec.name)}</span>
                            <span class="layout-badge">${escapeHtml(label)}</span>
                            <span class="layout-count">${sec.widgets.length} gadget${sec.widgets.length === 1 ? '' : 's'}</span>
                        </div>
                        <div class="layout-section-actions">
                            <button type="button" class="layout-btn layout-btn-primary" onclick="app.promptAddWidgetToSection('${sec.id}')"><i class="fa-solid fa-plus"></i> Add a Gadget</button>
                            <button type="button" class="layout-btn layout-btn-icon" title="Delete section" onclick="app.removeSection('${sec.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="layout-widget-list">${widgets}</div>
                </div>`;
            }

            renderLayoutWidget(sec, widget, index) {
                const info = NATIVE_WIDGET_REGISTRY[widget.type];
                const icon = info ? info.icon : 'fa-puzzle-piece';
                const selected = widget.id === this.selectedId ? ' is-selected' : '';
                const isFirst = index === 0;
                const isLast = index === sec.widgets.length - 1;
                return `<div class="layout-widget${selected}" data-widget-id="${widget.id}" onclick="app.selectWidget('${widget.id}')">
                    <i class="fa-solid fa-grip-vertical layout-grip"></i>
                    <i class="fa-solid ${icon} layout-widget-icon"></i>
                    <div class="layout-widget-text">
                        <span class="layout-widget-title">${escapeHtml(widget.title)}</span>
                        <span class="layout-widget-meta">${escapeHtml(widget.type)} &#183; #${escapeHtml(widget.id)}</span>
                    </div>
                    <div class="layout-widget-actions">
                        <button type="button" class="layout-mini" title="Move up" onclick="event.stopPropagation(); app.moveWidget('${sec.id}', ${index}, -1)" ${isFirst ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
                        <button type="button" class="layout-mini" title="Move down" onclick="event.stopPropagation(); app.moveWidget('${sec.id}', ${index}, 1)" ${isLast ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
                        <button type="button" class="layout-mini layout-mini-danger" title="Delete gadget" onclick="event.stopPropagation(); app.removeWidget('${sec.id}', '${widget.id}')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`;
            }

            applySelectionHighlight() {
                const root = document.getElementById('canvas-root');
                if (!root) return;
                const scope = root.shadowRoot || root;
                scope.querySelectorAll('.widget-node, .layout-widget').forEach((el) => {
                    el.classList.toggle('is-selected', el.dataset.widgetId === this.selectedId);
                });
            }

            selectWidget(widgetId) {
                const widget = this.findWidget(widgetId);
                if (!widget) return;
                this.selectedId = widget.id;
                const section = this.findSectionOfWidget(widget.id);
                this.selectedSectionId = section ? section.id : null;
                this.applySelectionHighlight();
                this.renderLeftPanel();
                this.renderPropertiesInspector();
            }

            findWidget(widgetId) {
                for (const section of this.schema.sections) {
                    const found = section.widgets.find((w) => w.id === widgetId);
                    if (found) return found;
                }
                return null;
            }

            findSectionOfWidget(widgetId) {
                return this.schema.sections.find((section) => section.widgets.some((w) => w.id === widgetId)) || null;
            }

            createSettings(type) {
                const info = NATIVE_WIDGET_REGISTRY[type] || NATIVE_WIDGET_REGISTRY.HTML;
                return JSON.parse(JSON.stringify(info.defaults || {}));
            }

            createWidget(type, title) {
                const info = NATIVE_WIDGET_REGISTRY[type] ? type : 'HTML';
                const registry = NATIVE_WIDGET_REGISTRY[info];
                let count = 1;
                let id = `${registry.idPrefix}${count}`;
                while (this.findWidget(id)) {
                    count++;
                    id = `${registry.idPrefix}${count}`;
                }
                return { id, type: info, title: title || registry.defaultTitle, settings: this.createSettings(info) };
            }

            addWidget(type) {
                const registry = NATIVE_WIDGET_REGISTRY[type];
                if (!registry) return;
                const sectionHints = { Header: 'header', PageList: 'navigation', Blog: 'main', FeaturedPost: 'featured', LinkList: 'footer', Attribution: 'footer' };
                const preferredType = sectionHints[type];
                let section = preferredType ? this.schema.sections.find((sec) => sec.type === preferredType) : null;
                if (!section) {
                    const { right, left } = this.getSidebarSections();
                    section = right[0] || left[0] || null;
                }
                if (!section) section = this.schema.sections.find((sec) => sec.type === 'main');
                if (!section) section = this.schema.sections[0];
                if (!section) {
                    this.showToast('Create a section first from the Layout tab.', 'error');
                    return;
                }
                const widget = this.createWidget(type);
                section.widgets.push(widget);
                this.selectedId = widget.id;
                this.selectedSectionId = section.id;
                this.saveState();
                this.renderAll();
                this.showToast(`${registry.defaultTitle} added to ${section.name}.`, 'success');
            }

            moveSection(index, delta) {
                const target = index + delta;
                if (target < 0 || target >= this.schema.sections.length) return;
                const sections = this.schema.sections;
                [sections[index], sections[target]] = [sections[target], sections[index]];
                this.saveState();
                this.renderAll();
            }

            moveWidget(sectionId, index, delta) {
                const section = this.schema.sections.find((sec) => sec.id === sectionId);
                if (!section) return;
                const target = index + delta;
                if (target < 0 || target >= section.widgets.length) return;
                [section.widgets[index], section.widgets[target]] = [section.widgets[target], section.widgets[index]];
                this.saveState();
                this.renderAll();
            }

            removeWidget(sectionId, widgetId) {
                const section = this.schema.sections.find((sec) => sec.id === sectionId);
                const widget = section ? section.widgets.find((w) => w.id === widgetId) : null;
                if (!section || !widget) return;
                this.promptConfirm('Delete Gadget', `Remove <b>${escapeHtml(widget.title)}</b> from ${escapeHtml(section.name)}? You can restore it with Undo (Ctrl+Z).`, () => {
                    section.widgets = section.widgets.filter((w) => w.id !== widgetId);
                    if (this.selectedId === widgetId) {
                        this.selectedId = null;
                        this.selectedSectionId = null;
                    }
                    this.saveState();
                    this.renderAll();
                    this.showToast('Gadget deleted.', 'info');
                });
            }

            removeSection(sectionId) {
                const section = this.schema.sections.find((sec) => sec.id === sectionId);
                if (!section) return;
                if (this.schema.sections.length === 1) {
                    this.showToast('A theme needs at least one section.', 'error');
                    return;
                }
                this.promptConfirm('Delete Section', `Delete <b>${escapeHtml(section.name)}</b> and its ${section.widgets.length} gadget(s)?`, () => {
                    this.schema.sections = this.schema.sections.filter((sec) => sec.id !== sectionId);
                    if (this.selectedSectionId === sectionId) {
                        this.selectedId = null;
                        this.selectedSectionId = null;
                    }
                    this.saveState();
                    this.renderAll();
                    this.showToast('Section deleted.', 'info');
                });
            }

            updateWidgetSetting(widgetId, key, rawValue, kind = 'string') {
                const widget = this.findWidget(widgetId);
                if (!widget) return;

                let value = rawValue;
                if (kind === 'number') {
                    const limits = { postsPerPage: [1, 20], maxPosts: [1, 10], snippetLength: [20, 500] };
                    const range = limits[key] || [1, 500];
                    value = Math.min(range[1], Math.max(range[0], parseInt(rawValue, 10) || range[0]));
                } else if (kind === 'boolean') {
                    value = Boolean(rawValue);
                }

                if (key === '__title__') {
                    const registry = NATIVE_WIDGET_REGISTRY[widget.type];
                    widget.title = String(value).trim() || (registry ? registry.defaultTitle : widget.type);
                } else if (key === '__pages_text__') {
                    widget.settings.pages = String(value).split(/[\n,]/).map((page) => page.trim()).filter(Boolean);
                } else if (key === '__links_text__') {
                    widget.settings.links = String(value).split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
                        const parts = line.split('|').map((part) => part.trim());
                        return { name: parts[0] || '', url: parts[1] || '#' };
                    }).filter((link) => link.name);
                } else {
                    widget.settings[key] = value;
                }

                this.saveState();
                this.renderCanvas();
                this.renderLeftPanel();
                if (key === '__title__') this.renderPropertiesInspector();
            }

            updateColor(key, value) {
                if (!/^#[0-9a-f]{6}$/i.test(value || '')) return;
                this.schema.customizer.colors[key] = value;
                this.saveState();
                this.renderCanvas();
                this.renderLeftPanel();
            }

            updateTypography(key, value) {
                const cleaned = String(value || '').trim();
                const isLength = /^\d+(\.\d+)?(px|rem|em|%|vw)$/.test(cleaned);
                if (key !== 'fontFamily' && !isLength) {
                    this.showToast('Use a valid CSS length such as 1200px, 72rem or 100%.', 'error');
                    this.renderLeftPanel();
                    return;
                }
                if (!cleaned) return;
                this.schema.customizer.typography[key] = cleaned;
                this.saveState();
                this.renderCanvas();
                this.renderLeftPanel();
            }

            resetCustomizer() {
                this.schema.customizer = JSON.parse(JSON.stringify(DEFAULT_CUSTOMIZER));
                this.saveState();
                this.renderCanvas();
                this.renderLeftPanel();
                this.showToast('Palette and typography reset to defaults.', 'info');
            }

            renderPropertiesInspector() {
                const container = document.getElementById('right-panel-content');
                const badge = document.getElementById('selected-item-badge');
                if (!container) return;

                const widget = this.selectedId ? this.findWidget(this.selectedId) : null;
                if (!widget) {
                    if (badge) badge.textContent = 'No selection';
                    container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">
                        <i class="fa-solid fa-hand-pointer text-2xl mb-2 text-slate-600"></i>
                        <p>Select any gadget in the canvas or the Layout tab to configure its properties.</p>
                    </div>`;
                    return;
                }

                const registry = NATIVE_WIDGET_REGISTRY[widget.type];
                const section = this.findSectionOfWidget(widget.id);
                if (badge) badge.textContent = widget.type;

                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-slate-900 border border-slate-700 rounded-lg p-3 space-y-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded bg-blogger-orange/15 text-blogger-orange flex items-center justify-center">
                                    <i class="fa-solid ${registry ? registry.icon : 'fa-puzzle-piece'}"></i>
                                </div>
                                <div class="min-w-0">
                                    <div class="text-xs font-bold text-slate-100 truncate">${escapeHtml(widget.title)}</div>
                                    <div class="text-[10px] text-slate-400 font-mono truncate">${escapeHtml(widget.id)} &#183; ${escapeHtml(widget.type)}</div>
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Widget Title</label>
                                <input type="text" value="${escapeHtml(widget.title)}" onchange="app.updateWidgetSetting('${widget.id}', '__title__', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:border-blogger-orange focus:outline-none">
                            </div>
                            <div class="text-[10px] text-slate-400">
                                Section: <span class="text-slate-300">${escapeHtml(section ? section.name : 'Unassigned')}</span>
                                <span class="font-mono">(${escapeHtml(section ? section.id : '-')})</span>
                            </div>
                        </div>
                        <div class="bg-slate-900 border border-slate-700 rounded-lg p-3 space-y-3">
                            <div class="text-xs font-bold text-slate-200">${escapeHtml(widget.type)} Settings</div>
                            ${this.renderWidgetSettings(widget)}
                        </div>
                        <button onclick="app.removeWidget('${section ? section.id : ''}', '${widget.id}')" class="w-full bg-red-600/80 hover:bg-red-600 text-white py-2 rounded text-xs font-semibold transition">
                            <i class="fa-solid fa-trash mr-1"></i> Delete Gadget
                        </button>
                        <p class="text-[10px] text-slate-500 leading-relaxed">Changes are applied instantly to the canvas and the compiled Blogger XML.</p>
                    </div>
                `;
            }

            settingInput(widget, key, label, placeholder = '') {
                return `<div>
                    <label class="text-[10px] text-slate-400 block mb-1">${escapeHtml(label)}</label>
                    <input type="text" value="${escapeHtml(widget.settings[key] ?? '')}" placeholder="${escapeHtml(placeholder)}" onchange="app.updateWidgetSetting('${widget.id}', '${key}', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:border-blogger-orange focus:outline-none">
                </div>`;
            }

            settingNumber(widget, key, label, min, max) {
                return `<div>
                    <label class="text-[10px] text-slate-400 block mb-1">${escapeHtml(label)}</label>
                    <input type="number" min="${min}" max="${max}" value="${escapeHtml(widget.settings[key] ?? min)}" onchange="app.updateWidgetSetting('${widget.id}', '${key}', this.value, 'number')" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:border-blogger-orange focus:outline-none">
                </div>`;
            }

            settingTextarea(widget, key, label, placeholder = '', rows = 3) {
                return `<div>
                    <label class="text-[10px] text-slate-400 block mb-1">${escapeHtml(label)}</label>
                    <textarea rows="${rows}" placeholder="${escapeHtml(placeholder)}" onchange="app.updateWidgetSetting('${widget.id}', '${key}', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 code-font focus:border-blogger-orange focus:outline-none">${escapeHtml(widget.settings[key] ?? '')}</textarea>
                </div>`;
            }

            settingCheckbox(widget, key, label) {
                return `<label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                    <input type="checkbox" ${widget.settings[key] ? 'checked' : ''} onchange="app.updateWidgetSetting('${widget.id}', '${key}', this.checked, 'boolean')" class="accent-orange-500 w-3.5 h-3.5">
                    <span>${escapeHtml(label)}</span>
                </label>`;
            }

            settingSelect(widget, key, label, options) {
                const current = widget.settings[key];
                const optionHtml = options.map((option) => `<option value="${escapeHtml(option.value)}" ${current === option.value ? 'selected' : ''}>${escapeHtml(option.label)}</option>`).join('');
                return `<div>
                    <label class="text-[10px] text-slate-400 block mb-1">${escapeHtml(label)}</label>
                    <select onchange="app.updateWidgetSetting('${widget.id}', '${key}', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:border-blogger-orange focus:outline-none">${optionHtml}</select>
                </div>`;
            }

            renderWidgetSettings(widget) {
                switch (widget.type) {
                    case 'Header':
                        return [
                            this.settingInput(widget, 'description', 'Blog Description', 'Short tagline'),
                            this.settingCheckbox(widget, 'showImage', 'Show logo image'),
                            this.settingInput(widget, 'imageLogo', 'Logo URL', 'https://...')
                        ].join('');
                    case 'Blog':
                        return [
                            this.settingNumber(widget, 'postsPerPage', 'Posts per page', 1, 20),
                            this.settingInput(widget, 'readMoreText', 'Read More Label', 'Continue Reading →'),
                            this.settingCheckbox(widget, 'showAuthor', 'Show author'),
                            this.settingCheckbox(widget, 'showTimestamp', 'Show timestamp'),
                            this.settingCheckbox(widget, 'showLabels', 'Show labels')
                        ].join('');
                    case 'PageList':
                        return [
                            this.settingCheckbox(widget, 'showHome', 'Include Home link'),
                            `<div>
                                <label class="text-[10px] text-slate-400 block mb-1">Pages (one per line or comma separated)</label>
                                <textarea rows="4" onchange="app.updateWidgetSetting('${widget.id}', '__pages_text__', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 focus:border-blogger-orange focus:outline-none">${escapeHtml((widget.settings.pages || []).join('\n'))}</textarea>
                            </div>`
                        ].join('');
                    case 'BlogSearch':
                        return this.settingInput(widget, 'placeholder', 'Placeholder Text', 'Search articles...');
                    case 'PopularPosts':
                        return [
                            this.settingNumber(widget, 'maxPosts', 'Maximum posts', 1, 10),
                            this.settingCheckbox(widget, 'showThumbnail', 'Show thumbnails'),
                            this.settingCheckbox(widget, 'showSnippet', 'Show snippet')
                        ].join('');
                    case 'Label':
                        return [
                            this.settingSelect(widget, 'displayMode', 'Display mode', [
                                { value: 'cloud', label: 'Label cloud' },
                                { value: 'list', label: 'Vertical list' }
                            ]),
                            this.settingCheckbox(widget, 'showCount', 'Show post counts')
                        ].join('');
                    case 'BlogArchive':
                        return this.settingSelect(widget, 'hierarchy', 'Hierarchy', [
                            { value: 'tree', label: 'Tree (collapsible)' },
                            { value: 'flat', label: 'Flat list' }
                        ]);
                    case 'Profile':
                        return this.settingTextarea(widget, 'bio', 'Bio', 'Short author bio', 4);
                    case 'HTML':
                        return this.settingTextarea(widget, 'content', 'HTML / JavaScript', '<div>Hello</div>', 6) + `<p class="text-[10px] text-slate-500 m-0">Preview renders as text for safety. Raw markup is written into the exported XML; bare ampersands are escaped automatically.</p>`;
                    case 'Image':
                        return [
                            this.settingInput(widget, 'imageUrl', 'Image URL', 'https://...'),
                            this.settingInput(widget, 'imageLink', 'Link URL', 'https://...'),
                            this.settingInput(widget, 'altText', 'Alt text', 'Descriptive text')
                        ].join('');
                    case 'LinkList':
                        return `<div>
                            <label class="text-[10px] text-slate-400 block mb-1">Links (one per line: Name | URL)</label>
                            <textarea rows="4" placeholder="Privacy Policy | #" onchange="app.updateWidgetSetting('${widget.id}', '__links_text__', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-200 code-font focus:border-blogger-orange focus:outline-none">${escapeHtml((widget.settings.links || []).map((link) => `${link.name} | ${link.url}`).join('\n'))}</textarea>
                        </div>`;
                    case 'Attribution':
                        return this.settingInput(widget, 'creditText', 'Credit Text', 'Powered by Blogger.');
                    case 'FeaturedPost':
                        return [
                            this.settingNumber(widget, 'snippetLength', 'Snippet length', 20, 500),
                            this.settingCheckbox(widget, 'showThumbnail', 'Show thumbnail')
                        ].join('');
                    case 'ContactForm':
                        return `<p class="text-[11px] text-slate-400 m-0">This gadget uses the native Blogger contact form. No visual settings are required.</p>`;
                    case 'ReportAbuse':
                        return `<p class="text-[11px] text-slate-400 m-0">This gadget renders the standard Blogger report abuse link.</p>`;
                    default:
                        return `<p class="text-[11px] text-slate-400 m-0">No dedicated settings for this gadget type.</p>`;
                }
            }

            prepareHtmlForXml(html) {
                return String(html).replace(/&(?!(?:#\d+|#x[0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);)/g, '&amp;');
            }

            getBloggerSectionClassName(type) {
                const classes = {
                    header: 'section header section-header',
                    navigation: 'section navbar section-navigation',
                    featured: 'section crosscol section-featured',
                    main: 'section main section-main',
                    'sidebar-left': 'section sidebar section-sidebar-left',
                    'sidebar-right': 'section sidebar section-sidebar-right',
                    sidebar: 'section sidebar section-sidebar',
                    footer: 'section footer section-footer'
                };
                return classes[type] || `section section-${type}`;
            }

            compileSectionXML(sec, indent = '        ') {
                const inner = `${indent}        `;
                const sectionClass = this.getBloggerSectionClassName(sec.type);
                const growth = sec.type === 'navigation' || sec.type === 'footer' ? 'horizontal' : 'vertical';
                const preferred = this.isSidebarType(sec.type) || sec.type === 'footer' ? " preferred='yes'" : '';
                let xml = `${indent}<div class='section-wrap section-${sec.type}'>\n`;
                xml += `${indent}    <b:section class='${sectionClass}' growth='${growth}' id='${escapeHtml(sec.id)}' name='${escapeHtml(sec.name)}'${preferred} showaddelement='yes'>\n`;
                sec.widgets.forEach((widget) => {
                    xml += this.compileWidgetXML(widget, inner);
                });
                xml += `${indent}    </b:section>\n`;
                xml += `${indent}</div>\n`;
                return xml;
            }

            compileWidgetXML(widget, indent = '            ') {
                const registry = NATIVE_WIDGET_REGISTRY[widget.type] || NATIVE_WIDGET_REGISTRY.HTML;
                const pad = `${indent}    `;
                const deep = `${pad}    `;
                let body = '';

                if (widget.type === 'Header') {
                    body += `${deep}<div class='blog-header-inner'>\n`;
                    if (widget.settings.showImage && widget.settings.imageLogo) {
                        body += `${deep}    <img alt='${escapeHtml(widget.title)}' class='blog-logo' src='${escapeHtml(widget.settings.imageLogo)}'/>\n`;
                    }
                    body += `${deep}    <div class='blog-heading'>\n`;
                    body += `${deep}        <b:if cond='data:blog.url == data:blog.homepageUrl'>\n`;
                    body += `${deep}            <h1 class='blog-title'><data:blog.title/></h1>\n`;
                    body += `${deep}        <b:else/>\n`;
                    body += `${deep}            <a class='blog-title' expr:href='data:blog.homepageUrl'><data:blog.title/></a>\n`;
                    body += `${deep}        </b:if>\n`;
                    body += `${deep}        <p class='blog-description'><data:description/></p>\n`;
                    body += `${deep}    </div>\n`;
                    body += `${deep}</div>\n`;
                } else if (widget.type === 'Blog') {
                    const metaParts = [];
                    if (widget.settings.showTimestamp !== false) metaParts.push('<data:post.timestamp/>');
                    if (widget.settings.showAuthor !== false) metaParts.push('<data:post.author/>');
                    const metaXml = metaParts.join(' &#183; ');
                    body += `${deep}<div class='blog-posts'>\n`;
                    body += `${deep}    <b:loop values='data:posts' var='post'>\n`;
                    body += `${deep}        <article class='post-item'>\n`;
                    body += `${deep}            <b:if cond='data:post.thumbnailUrl'>\n`;
                    body += `${deep}                <img class='post-thumb' expr:alt='data:post.title' expr:src='data:post.thumbnailUrl'/>\n`;
                    body += `${deep}            </b:if>\n`;
                    body += `${deep}            <h2 class='post-title'><a expr:href='data:post.url'><data:post.title/></a></h2>\n`;
                    if (metaXml) body += `${deep}            <div class='post-meta'>${metaXml}</div>\n`;
                    body += `${deep}            <div class='post-snippet'><data:post.snippet/></div>\n`;
                    if (widget.settings.showLabels !== false) {
                        body += `${deep}            <div class='post-labels'>\n`;
                        body += `${deep}                <b:loop values='data:post.labels' var='label'>\n`;
                        body += `${deep}                    <a class='label-link' expr:href='data:label.url'><data:label.name/></a>\n`;
                        body += `${deep}                </b:loop>\n`;
                        body += `${deep}            </div>\n`;
                    }
                    body += `${deep}            <a class='read-more' expr:href='data:post.url'>${escapeHtml(widget.settings.readMoreText || 'Read More')}</a>\n`;
                    body += `${deep}        </article>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}    <b:if cond='data:olderPageUrl'>\n`;
                    body += `${deep}        <a class='blog-pager-older-link' expr:href='data:olderPageUrl'>Older Posts</a>\n`;
                    body += `${deep}    </b:if>\n`;
                    body += `${deep}</div>\n`;
                } else if (widget.type === 'PageList') {
                    body += `${deep}<ul class='page-list'>\n`;
                    body += `${deep}    <b:loop values='data:links' var='link'>\n`;
                    body += `${deep}        <li><a expr:href='data:link.href'><data:link.title/></a></li>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}</ul>\n`;
                } else if (widget.type === 'BlogSearch') {
                    body += `${deep}<form action='/search' class='blog-search-form' method='get'>\n`;
                    body += `${deep}    <input name='q' placeholder='${escapeHtml(widget.settings.placeholder || 'Search...')}' type='text'/>\n`;
                    body += `${deep}    <input value='Search' type='submit'/>\n`;
                    body += `${deep}</form>\n`;
                } else if (widget.type === 'PopularPosts') {
                    body += `${deep}<div class='popular-posts'>\n`;
                    body += `${deep}    <b:loop values='data:posts' var='post'>\n`;
                    body += `${deep}        <div class='popular-post'>\n`;
                    if (widget.settings.showThumbnail !== false) {
                        body += `${deep}            <b:if cond='data:post.thumbnailUrl'>\n`;
                        body += `${deep}                <img class='popular-thumb' expr:alt='data:post.title' expr:src='data:post.thumbnailUrl'/>\n`;
                        body += `${deep}            </b:if>\n`;
                    }
                    body += `${deep}            <a expr:href='data:post.url'><data:post.title/></a>\n`;
                    body += `${deep}        </div>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}</div>\n`;
                } else if (widget.type === 'Label') {
                    body += `${deep}<div class='label-list'>\n`;
                    body += `${deep}    <b:loop values='data:labels' var='label'>\n`;
                    body += `${deep}        <a class='label-link' expr:href='data:label.url'><data:label.name/></a>\n`;
                    body += `${deep}        <b:if cond='data:label.count'><span class='label-count'><data:label.count/></span></b:if>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}</div>\n`;
                } else if (widget.type === 'BlogArchive') {
                    body += `${deep}<ul class='archive-list'>\n`;
                    body += `${deep}    <b:loop values='data:data' var='i'>\n`;
                    body += `${deep}        <li><a expr:href='data:i.url'><data:i.name/></a></li>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}</ul>\n`;
                } else if (widget.type === 'Profile') {
                    body += `${deep}<div class='profile-widget'>\n`;
                    body += `${deep}    <span class='profile-name'><data:displayname/></span>\n`;
                    body += `${deep}    <b:if cond='data:aboutme'><p><data:aboutme/></p></b:if>\n`;
                    body += `${deep}</div>\n`;
                } else if (widget.type === 'FeaturedPost') {
                    body += `${deep}<div class='featured-post'>\n`;
                    body += `${deep}    <b:loop values='data:posts' var='post'>\n`;
                    if (widget.settings.showThumbnail !== false) {
                        body += `${deep}        <b:if cond='data:post.thumbnailUrl'>\n`;
                        body += `${deep}            <img class='featured-image' expr:alt='data:post.title' expr:src='data:post.thumbnailUrl'/>\n`;
                        body += `${deep}        </b:if>\n`;
                    }
                    body += `${deep}        <h2><a expr:href='data:post.url'><data:post.title/></a></h2>\n`;
                    body += `${deep}        <p><data:post.snippet/></p>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}</div>\n`;
                } else if (widget.type === 'HTML') {
                    body += `${deep}<div class='html-widget-body'>${this.prepareHtmlForXml(widget.settings.content || '')}</div>\n`;
                } else if (widget.type === 'Image') {
                    const src = escapeHtml(widget.settings.imageUrl || 'https://placehold.co/400x200/E2E8F0/64748B?text=Image');
                    body += `${deep}<div class='image-widget'><img alt='${escapeHtml(widget.settings.altText || widget.title)}' src='${src}'/></div>\n`;
                } else if (widget.type === 'LinkList') {
                    body += `${deep}<ul class='link-list'>\n`;
                    body += `${deep}    <b:loop values='data:links' var='link'>\n`;
                    body += `${deep}        <li><a expr:href='data:link.target'><data:link.name/></a></li>\n`;
                    body += `${deep}    </b:loop>\n`;
                    body += `${deep}</ul>\n`;
                } else if (widget.type === 'Attribution') {
                    body += `${deep}<div class='attribution'><data:blog.title/> &#183; ${escapeHtml(widget.settings.creditText || 'Powered by Blogger.')}</div>\n`;
                } else if (widget.type === 'ContactForm') {
                    body += `${deep}<div class='contact-form-widget'><p>Contact form provided by Blogger.</p></div>\n`;
                } else if (widget.type === 'ReportAbuse') {
                    body += `${deep}<a class='report-abuse' expr:href='data:blog.homepageUrl'>Report Abuse</a>\n`;
                } else {
                    body += `${deep}<div class='standard-widget-body'>Widget content for ${escapeHtml(widget.type)}</div>\n`;
                }

                let xml = `${indent}<b:widget id='${widget.id}' locked='false' title='${escapeHtml(widget.title)}' type='${widget.type}' version='${registry.version}'>\n`;
                xml += `${pad}<b:includable id='main'>\n`;
                xml += `${deep}<div class='widget-content widget-${widget.type.toLowerCase()}'>\n`;
                if (WIDGETS_WITHOUT_TITLE.indexOf(widget.type) === -1) {
                    xml += `${deep}    <h2><data:title/></h2>\n`;
                }
                xml += body;
                xml += `${deep}</div>\n`;
                xml += `${pad}</b:includable>\n`;
                xml += `${indent}</b:widget>\n`;
                return xml;
            }

            compileBloggerXML() {
                const { left: leftSidebarSections, right: rightSidebarSections } = this.getSidebarSections();
                const hasMainSection = this.schema.sections.some((sec) => sec.type === 'main');
                const hasSidebarSections = leftSidebarSections.length > 0 || rightSidebarSections.length > 0;
                let columnsRendered = false;

                let xml = `<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:css='false' b:js='true' b:version='2' class='v2' expr:dir='data:blog.languageDirection' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <meta charset='utf-8'/>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
    <b:include data='blog' name='all-head-content'/>
    <title><data:blog.pageTitle/></title>
    <b:skin><![CDATA[
${this.buildThemeCSS('body', '@media (max-width: 600px)')}
    ]]></b:skin>
    <b:template-skin><![CDATA[
${this.buildLayoutGuardCSS()}
    ]]></b:template-skin>
${CLOSE_HEAD_TAG}
${OPEN_BODY_TAG}
    <div class='main-wrapper'>
`;

                this.schema.sections.forEach((sec) => {
                    if (this.isSidebarType(sec.type) && hasMainSection) return;
                    if (sec.type === 'footer') return;

                    if (sec.type === 'main' && hasSidebarSections && !columnsRendered) {
                        columnsRendered = true;
                        xml += `        <div class='content-container'>\n`;
                        if (leftSidebarSections.length) {
                            xml += `            <div class='sidebar-left-col'>\n`;
                            leftSidebarSections.forEach((sidebarSec) => {
                                xml += this.compileSectionXML(sidebarSec, '                ');
                            });
                            xml += `            </div>\n`;
                        }
                        xml += `            <div class='posts-col'>\n`;
                        xml += this.compileSectionXML(sec, '                ');
                        xml += `            </div>\n`;
                        if (rightSidebarSections.length) {
                            xml += `            <div class='sidebar-right-col'>\n`;
                            rightSidebarSections.forEach((sidebarSec) => {
                                xml += this.compileSectionXML(sidebarSec, '                ');
                            });
                            xml += `            </div>\n`;
                        }
                        xml += `        </div>\n`;
                        return;
                    }

                    xml += this.compileSectionXML(sec);
                });

                xml += `    </div>\n`;

                const footerSections = this.schema.sections.filter((sec) => sec.type === 'footer');
                if (footerSections.length) {
                    xml += `    <div class='footer-wrapper'>\n`;
                    footerSections.forEach((sec) => {
                        xml += this.compileSectionXML(sec, '    ');
                    });
                    xml += `    </div>\n`;
                }

                xml += `${CLOSE_BODY_TAG}\n${CLOSE_HTML_TAG}`;

                const preview = document.getElementById('xml-quick-preview');
                if (preview) preview.textContent = xml;
                const meta = document.getElementById('xml-meta');
                if (meta) {
                    const widgetCount = this.schema.sections.reduce((total, sec) => total + sec.widgets.length, 0);
                    meta.textContent = `${this.schema.sections.length} sections · ${widgetCount} widgets · ${xml.split('\n').length} lines`;
                }
                return xml;
            }

            validateTheme() {
                try {
                    const xml = this.compileBloggerXML();
                    const doc = new DOMParser().parseFromString(xml, 'application/xml');
                    const parserError = doc.getElementsByTagName('parsererror')[0];
                    if (parserError) {
                        this.showModal('XML Validation Error', `<p class="text-red-400 font-mono text-xs mb-3 break-words">${escapeHtml(parserError.textContent)}</p>`, 'error');
                        return false;
                    }

                    const elements = Array.from(doc.getElementsByTagName('*'));
                    const skins = elements.filter((el) => el.localName === 'skin');
                    const sections = elements.filter((el) => el.localName === 'section');
                    const widgets = elements.filter((el) => el.localName === 'widget');
                    const widgetIds = widgets.map((el) => el.getAttribute('id'));
                    const duplicateIds = [...new Set(widgetIds.filter((id, index) => widgetIds.indexOf(id) !== index))];
                    const issues = [];

                    if (skins.length !== 1) issues.push(`Expected exactly one &lt;b:skin&gt; declaration but found ${skins.length}.`);
                    if (!sections.length) issues.push('No &lt;b:section&gt; elements were generated.');
                    if (duplicateIds.length) issues.push(`Duplicate widget IDs: ${escapeHtml(duplicateIds.join(', '))}.`);
                    const emptySections = sections.filter((sec) => !Array.from(sec.children).some((child) => child.localName === 'widget'));

                    if (issues.length) {
                        this.showModal('Validation Failed', `<ul class="text-xs space-y-2 text-amber-300 list-disc pl-4">${issues.map((issue) => `<li>${issue}</li>`).join('')}</ul>`, 'error');
                        return false;
                    }

                    this.showModal('Validation Successful', `<div class="text-emerald-400 space-y-2 text-xs">
                        <p><i class="fa-solid fa-check-circle mr-1"></i> XML syntax is well-formed.</p>
                        <p><i class="fa-solid fa-check-circle mr-1"></i> Exactly one <code>&lt;b:skin&gt;</code> declaration found.</p>
                        <p><i class="fa-solid fa-check-circle mr-1"></i> ${sections.length} sections and ${widgets.length} widgets match the canonical Blogger architecture.</p>
                        <p><i class="fa-solid fa-check-circle mr-1"></i> All widget IDs are unique.</p>
                        ${emptySections.length ? `<p class="text-slate-400 pt-2 border-t border-slate-700"><i class="fa-solid fa-circle-info mr-1"></i> ${emptySections.length} empty section(s) will show the "Add a Gadget" link in Blogger.</p>` : ''}
                    </div>`, 'success');
                    return true;
                } catch (error) {
                    this.showModal('Validation Exception', `<p class="text-red-400 text-xs">${escapeHtml(error.message)}</p>`, 'error');
                    return false;
                }
            }

            async copyXML() {
                const xml = this.compileBloggerXML();
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(xml);
                    } else {
                        const textArea = document.createElement('textarea');
                        textArea.value = xml;
                        textArea.style.position = 'fixed';
                        textArea.style.opacity = '0';
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }
                    this.showToast('XML copied to clipboard.', 'success');
                } catch (error) {
                    this.showToast('Failed to copy XML. Use Export XML instead.', 'error');
                }
            }

            downloadXML() {
                const xml = this.compileBloggerXML();
                const blob = new Blob([xml], { type: 'text/xml' });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement('a');
                const slug = this.schema.metadata.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'blogger-theme';
                anchor.href = url;
                anchor.download = `${slug}.xml`;
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
                URL.revokeObjectURL(url);
                this.showToast('Blogger XML template downloaded.', 'success');
            }

            promptImportXML() {
                this.showModal('Import Blogger XML Template', `
                    <p class="text-xs text-slate-400 mb-3">Upload or paste an existing Blogger XML theme. Sections and widgets are rebuilt from the template, and CSS variables are reused when present.</p>
                    <input type="file" accept=".xml,text/xml,application/xml" onchange="app.handleImportFile(event)" class="w-full mb-3 text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
                    <textarea id="import-xml-textarea" class="w-full h-48 bg-slate-900 border border-slate-700 rounded p-2 text-xs code-font text-slate-200 mb-3" placeholder="Paste Blogger XML here..."></textarea>
                    <button onclick="app.executeImport()" class="w-full bg-blogger-orange hover:bg-blogger-darkorange text-white py-2 rounded text-xs font-semibold transition">Parse &amp; Import Template</button>
                `, 'normal');
            }

            handleImportFile(event) {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const textarea = document.getElementById('import-xml-textarea');
                    if (textarea) {
                        textarea.value = String(reader.result || '');
                        this.showToast(`${file.name} loaded. Click Parse & Import.`, 'info');
                    }
                };
                reader.onerror = () => this.showToast('Failed to read the selected file.', 'error');
                reader.readAsText(file);
            }

            sanitizeId(value, fallback) {
                const cleaned = String(value || '')
                    .replace(/[^A-Za-z0-9_-]/g, '_')
                    .replace(/^[^A-Za-z]+/, '');
                return cleaned || fallback;
            }

            formatSectionName(type) {
                return SECTION_TYPE_LABELS[type] || 'Custom Section';
            }

            detectSectionType(sectionEl, index) {
                const classAttr = sectionEl.getAttribute('class') || '';
                const classMatch = classAttr.match(/section-([a-z0-9_-]+)/i);
                if (classMatch) {
                    const type = classMatch[1].toLowerCase();
                    if (SECTION_TYPE_LABELS[type]) return type;
                }
                const id = (sectionEl.getAttribute('id') || '').toLowerCase();
                if (id.includes('header')) return 'header';
                if (id.includes('nav')) return 'navigation';
                if (id.includes('featured')) return 'featured';
                if (id.includes('sidebar') || id.includes('side')) {
                    if (id.includes('left')) return 'sidebar-left';
                    if (id.includes('right')) return 'sidebar-right';
                    return 'sidebar';
                }
                if (id.includes('footer')) return 'footer';
                return index === 0 ? 'header' : 'main';
            }

            executeImport() {
                const textarea = document.getElementById('import-xml-textarea');
                const source = textarea ? textarea.value.trim() : '';
                if (!source) {
                    this.showToast('Paste or upload a Blogger XML template first.', 'error');
                    return;
                }

                const doc = new DOMParser().parseFromString(source, 'application/xml');
                if (doc.getElementsByTagName('parsererror').length > 0) {
                    this.showToast('Invalid XML. Fix the syntax errors before importing.', 'error');
                    return;
                }

                const elements = Array.from(doc.getElementsByTagName('*'));
                const sectionEls = elements.filter((el) => el.localName === 'section');
                if (!sectionEls.length) {
                    this.showToast('No section elements found in this template.', 'error');
                    return;
                }

                const usedSectionIds = new Set();
                const usedWidgetIds = new Set();
                let widgetCount = 0;

                const sections = sectionEls.map((sectionEl, index) => {
                    const type = this.detectSectionType(sectionEl, index);
                    const baseId = this.sanitizeId(sectionEl.getAttribute('id'), `imported-section-${index + 1}`);
                    let sectionId = baseId;
                    let suffix = 1;
                    while (usedSectionIds.has(sectionId)) {
                        suffix++;
                        sectionId = `${baseId}-${suffix}`;
                    }
                    usedSectionIds.add(sectionId);

                    const widgetEls = Array.from(sectionEl.children).filter((el) => el.localName === 'widget');
                    const widgets = widgetEls.map((widgetEl, widgetIndex) => {
                        const rawType = widgetEl.getAttribute('type') || 'HTML';
                        const type2 = NATIVE_WIDGET_REGISTRY[rawType] ? rawType : 'HTML';
                        const registry = NATIVE_WIDGET_REGISTRY[type2];
                        const baseWidgetId = this.sanitizeId(widgetEl.getAttribute('id'), `${registry.idPrefix}${widgetIndex + 1}`);
                        let widgetId = baseWidgetId;
                        let widgetSuffix = 1;
                        while (usedWidgetIds.has(widgetId)) {
                            widgetSuffix++;
                            widgetId = `${baseWidgetId}${widgetSuffix}`;
                        }
                        usedWidgetIds.add(widgetId);
                        widgetCount++;
                        return {
                            id: widgetId,
                            type: type2,
                            title: widgetEl.getAttribute('title') || registry.defaultTitle,
                            settings: this.createSettings(type2)
                        };
                    });

                    return { id: sectionId, name: this.formatSectionName(type), type, widgets };
                });

                const skinEl = elements.find((el) => el.localName === 'skin');
                const skinCss = skinEl ? skinEl.textContent : '';
                if (skinCss) {
                    const cssVar = (name, fallback) => {
                        const match = skinCss.match(new RegExp(`--${name}\\s*:\\s*([^;]+);`));
                        return match ? match[1].trim() : fallback;
                    };
                    const colors = this.schema.customizer.colors;
                    colors.primary = cssVar('primary-color', colors.primary);
                    colors.secondary = cssVar('secondary-color', colors.secondary);
                    colors.background = cssVar('bg-color', colors.background);
                    colors.surface = cssVar('surface-color', colors.surface);
                    colors.text = cssVar('text-color', colors.text);
                    colors.muted = cssVar('muted-color', colors.muted);
                    colors.border = cssVar('border-color', colors.border);
                    colors.links = cssVar('link-color', colors.links);
                    const cssVarExists = (name) => new RegExp(`--${name}\\s*:`).test(skinCss);
                    const typography = this.schema.customizer.typography;
                    typography.fontFamily = cssVar('font-family', typography.fontFamily);
                    typography.headingSize = cssVar('heading-size', typography.headingSize);
                    typography.bodySize = cssVar('body-size', typography.bodySize);
                    typography.mainWidth = cssVar('main-width', typography.mainWidth);
                    typography.postWidth = cssVar('post-width', typography.postWidth);
                    typography.sidebarLeftWidth = cssVar('sidebar-left-width', typography.sidebarLeftWidth);
                    typography.sidebarRightWidth = cssVar('sidebar-right-width', typography.sidebarRightWidth);
                    if (cssVarExists('sidebar-width') && !cssVarExists('sidebar-right-width')) {
                        typography.sidebarRightWidth = cssVar('sidebar-width', typography.sidebarRightWidth);
                    }
                }

                this.schema.sections = sections;
                this.selectedId = null;
                this.selectedSectionId = null;
                this.saveState();
                this.renderAll();
                this.closeModal();
                this.showToast(`Imported ${sections.length} sections and ${widgetCount} widgets.`, 'success');
            }

            promptAddSection() {
                const typeOptions = Object.entries(SECTION_TYPE_LABELS).map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
                this.showModal('Add Blogger Section', `
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="text-slate-400 block mb-1">Section Name</label>
                            <input type="text" id="new-sec-name" value="Custom Section" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200">
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Section ID</label>
                            <input type="text" id="new-sec-id" value="custom-sec-1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200 code-font">
                            <p class="text-[10px] text-slate-500 mt-1">Letters, numbers, hyphens and underscores only.</p>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Section Type</label>
                            <select id="new-sec-type" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200">${typeOptions}</select>
                        </div>
                        <button onclick="app.executeAddSection()" class="w-full bg-blogger-orange hover:bg-blogger-darkorange text-white py-2 rounded font-semibold transition">Create Section</button>
                    </div>
                `, 'normal');
            }

            executeAddSection() {
                const nameInput = document.getElementById('new-sec-name');
                const idInput = document.getElementById('new-sec-id');
                const typeInput = document.getElementById('new-sec-type');
                const name = (nameInput ? nameInput.value : '').trim() || 'Custom Section';
                const sectionId = (idInput ? idInput.value : '').trim();
                const type = typeInput ? typeInput.value : 'main';

                if (!/^[A-Za-z][A-Za-z0-9_-]*$/.test(sectionId)) {
                    this.showToast('Section ID must start with a letter and contain only letters, numbers, - or _.', 'error');
                    return;
                }
                if (this.schema.sections.some((sec) => sec.id === sectionId)) {
                    this.showToast('That section ID already exists. Choose a unique ID.', 'error');
                    return;
                }
                if (!SECTION_TYPE_LABELS[type]) {
                    this.showToast('Unknown section type.', 'error');
                    return;
                }

                this.schema.sections.push({ id: sectionId, name, type, widgets: [] });
                this.selectedSectionId = sectionId;
                this.saveState();
                this.renderAll();
                this.closeModal();
                this.showToast(`${name} added.`, 'success');
            }

            promptAddWidgetToSection(sectionId) {
                const section = this.schema.sections.find((sec) => sec.id === sectionId);
                if (!section) return;
                const options = Object.entries(NATIVE_WIDGET_REGISTRY)
                    .map(([type, info]) => `<option value="${type}">${escapeHtml(info.defaultTitle)} (${type})</option>`)
                    .join('');
                this.showModal('Add Gadget to Section', `
                    <div class="space-y-3 text-xs">
                        <p class="text-slate-400">Target section: <span class="text-slate-200 font-semibold">${escapeHtml(section.name)}</span> <span class="font-mono text-slate-500">#${escapeHtml(section.id)}</span></p>
                        <div>
                            <label class="text-slate-400 block mb-1">Native Blogger Gadget</label>
                            <select id="modal-widget-type" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200">${options}</select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Custom Title (optional)</label>
                            <input type="text" id="modal-widget-title" placeholder="Defaults to the gadget name" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200">
                        </div>
                        <button onclick="app.executeAddWidgetToSection('${section.id}')" class="w-full bg-blogger-orange hover:bg-blogger-darkorange text-white py-2 rounded font-semibold transition">Add Gadget</button>
                    </div>
                `, 'normal');
            }

            executeAddWidgetToSection(sectionId) {
                const section = this.schema.sections.find((sec) => sec.id === sectionId);
                const typeInput = document.getElementById('modal-widget-type');
                const titleInput = document.getElementById('modal-widget-title');
                const type = typeInput ? typeInput.value : '';
                if (!section || !NATIVE_WIDGET_REGISTRY[type]) {
                    this.showToast('Unable to add this gadget.', 'error');
                    return;
                }
                const customTitle = titleInput ? titleInput.value.trim() : '';
                const widget = this.createWidget(type, customTitle);
                section.widgets.push(widget);
                this.selectedId = widget.id;
                this.selectedSectionId = section.id;
                this.saveState();
                this.renderAll();
                this.closeModal();
                this.showToast(`${NATIVE_WIDGET_REGISTRY[type].defaultTitle} added to ${section.name}.`, 'success');
            }

            renameProject() {
                this.showModal('Rename Project', `
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="text-slate-400 block mb-1">Project Name</label>
                            <input type="text" id="project-rename-input" value="${escapeHtml(this.schema.metadata.name)}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200">
                        </div>
                        <button onclick="app.executeRenameProject()" class="w-full bg-blogger-orange hover:bg-blogger-darkorange text-white py-2 rounded font-semibold transition">Save Name</button>
                    </div>
                `, 'normal');
            }

            executeRenameProject() {
                const input = document.getElementById('project-rename-input');
                const name = input ? input.value.trim() : '';
                if (!name) {
                    this.showToast('Project name cannot be empty.', 'error');
                    return;
                }
                this.schema.metadata.name = name;
                const display = document.getElementById('project-name-display');
                if (display) display.textContent = name;
                this.saveState();
                this.closeModal();
                this.showToast('Project name updated.', 'success');
            }

            promptConfirm(title, messageHtml, action) {
                this.pendingAction = action;
                this.showModal(title, `
                    <p class="text-xs text-slate-300 leading-relaxed mb-4">${messageHtml}</p>
                    <div class="flex items-center gap-2">
                        <button onclick="app.closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded text-xs font-semibold transition">Cancel</button>
                        <button onclick="app.runPendingAction()" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2 rounded text-xs font-semibold transition">Delete</button>
                    </div>
                `, 'error');
            }

            runPendingAction() {
                const action = this.pendingAction;
                this.pendingAction = null;
                this.closeModal();
                if (typeof action === 'function') action();
            }

            showModal(title, content, type = 'normal') {
                const modal = document.getElementById('modal-container');
                if (!modal) return;
                const icon = type === 'error'
                    ? 'fa-triangle-exclamation text-red-400'
                    : type === 'success'
                        ? 'fa-circle-check text-emerald-400'
                        : 'fa-circle-info text-blogger-orange';
                modal.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-6 shadow-2xl" role="dialog" aria-modal="true">
                        <div class="flex items-center justify-between gap-3 mb-4 pb-2 border-b border-slate-700">
                            <h3 class="font-bold text-sm text-slate-100 flex items-center"><i class="fa-solid ${icon} mr-2"></i>${escapeHtml(title)}</h3>
                            <button onclick="app.closeModal()" class="text-slate-400 hover:text-white" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div>${content}</div>
                    </div>
                `;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                const firstField = modal.querySelector('input, textarea, select');
                if (firstField) setTimeout(() => firstField.focus(), 40);
            }

            closeModal() {
                const modal = document.getElementById('modal-container');
                this.pendingAction = null;
                if (!modal) return;
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }

            showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const background = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-700';
                const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle';
                const toast = document.createElement('div');
                toast.className = `${background} text-white px-4 py-3 rounded-lg shadow-xl text-xs flex items-center space-x-2 transition transform translate-y-2 opacity-0 pointer-events-auto`;
                toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(message)}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            setupEventListeners() {
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        this.closeModal();
                        return;
                    }
                    const target = event.target;
                    const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
                    const isTyping = tagName === 'input' || tagName === 'textarea' || tagName === 'select' || (target && target.isContentEditable);
                    if (!(event.ctrlKey || event.metaKey) || isTyping) return;
                    const key = event.key.toLowerCase();
                    if (key === 'z') {
                        event.preventDefault();
                        if (event.shiftKey) this.redo();
                        else this.undo();
                    } else if (key === 'y') {
                        event.preventDefault();
                        this.redo();
                    }
                });

                const modal = document.getElementById('modal-container');
                if (modal) {
                    modal.addEventListener('click', (event) => {
                        if (event.target === modal) this.closeModal();
                    });
                }

                const canvasRoot = document.getElementById('canvas-root');
                if (canvasRoot) {
                    canvasRoot.addEventListener('click', (event) => {
                        const link = event.target.closest('a');
                        if (link) event.preventDefault();
                    });
                }
            }
        }

        const app = new BloggerThemeBuilderPro();
        window.app = app;
    </script>
</body>
</html>
