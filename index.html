<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogger Theme Builder Pro - 1:1 Visual Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blogger: {
                            orange: '#F57C00',
                            darkorange: '#E65100',
                            dark: '#202124',
                            surface: '#F8F9FA'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .code-font { font-family: 'Fira Code', monospace; }
        #canvas-root .widget-node { outline: 1px dashed transparent; outline-offset: 2px; border-radius: 8px; transition: outline-color .15s ease; }
        #canvas-root .widget-node:hover { outline-color: rgba(245, 124, 0, .55); cursor: pointer; }
        #canvas-root .widget-node.is-selected { outline: 2px solid #F57C00; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden select-none">

    <!-- TOP TOOLBAR -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-blogger-orange text-white p-2 rounded-lg font-bold text-sm flex items-center shadow-lg shadow-orange-500/20">
                <i class="fa-brands fa-blogger text-lg mr-2"></i> BTBP
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span id="project-name-display" class="font-semibold text-sm tracking-tight text-white cursor-pointer hover:text-blogger-orange transition" title="Click to rename" onclick="app.renameProject()">Modern Mag Pro v2.6</span>
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-medium border border-emerald-500/30">1:1 Synced Studio</span>
                </div>
                <div class="text-[10px] text-slate-400">Canonical Blogger Theme Schema Active</div>
            </div>
        </div>

        <div class="hidden md:flex items-center space-x-1 bg-slate-900/80 p-1 rounded-lg border border-slate-700">
            <button onclick="app.setViewport('desktop')" id="vp-desktop" class="px-3 py-1 rounded text-xs font-medium text-slate-200 bg-slate-700 shadow transition flex items-center space-x-1.5"><i class="fa-solid fa-desktop"></i><span>Desktop (1440)</span></button>
            <button onclick="app.setViewport('tablet')" id="vp-tablet" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition flex items-center space-x-1.5"><i class="fa-solid fa-tablet-screen-button"></i><span>Tablet (768)</span></button>
            <button onclick="app.setViewport('mobile')" id="vp-mobile" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition flex items-center space-x-1.5"><i class="fa-solid fa-mobile-screen"></i><span>Mobile (375)</span></button>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="app.promptImportXML()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center space-x-1.5 border border-slate-600" title="Import existing Blogger XML">
                <i class="fa-solid fa-file-import text-emerald-400"></i><span>Import XML</span>
            </button>
            <button onclick="app.validateTheme()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center space-x-1.5 border border-slate-600">
                <i class="fa-solid fa-shield-halved text-amber-400"></i><span>Validate</span>
            </button>
            <button onclick="app.copyXML()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center space-x-1.5 border border-slate-600">
                <i class="fa-solid fa-copy text-blue-400"></i><span>Copy XML</span>
            </button>
            <button onclick="app.downloadXML()" class="px-3 py-1.5 bg-blogger-orange hover:bg-blogger-darkorange text-white text-xs font-semibold rounded-lg transition flex items-center space-x-1.5 shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-download"></i><span>Export XML</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">

        <!-- LEFT PANEL: Navigation & Toolbox -->
        <aside id="left-panel" class="w-72 bg-slate-800 border-r border-slate-700 flex flex-col z-20 shrink-0">
            <div class="grid grid-cols-4 bg-slate-900 p-1 border-b border-slate-700 text-center text-xs">
                <button onclick="app.switchTab('elements')" id="tab-btn-elements" class="py-2 font-medium text-slate-200 bg-slate-800 rounded transition flex flex-col items-center justify-center"><i class="fa-solid fa-shapes text-sm mb-0.5 text-blogger-orange"></i><span>Add</span></button>
                <button onclick="app.switchTab('layout')" id="tab-btn-layout" class="py-2 font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center"><i class="fa-solid fa-layer-group text-sm mb-0.5"></i><span>Layout</span></button>
                <button onclick="app.switchTab('customizer')" id="tab-btn-customizer" class="py-2 font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center"><i class="fa-solid fa-palette text-sm mb-0.5"></i><span>Theme</span></button>
                <button onclick="app.switchTab('xml')" id="tab-btn-xml" class="py-2 font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center"><i class="fa-solid fa-code text-sm mb-0.5"></i><span>XML</span></button>
            </div>

            <div id="left-tab-content" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-4"></div>
        </aside>

        <!-- CENTER PANEL: Interactive Canvas & Viewports -->
        <main class="flex-1 bg-slate-950 flex flex-col overflow-hidden relative">
            <div class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-10 shrink-0">
                <div class="flex items-center space-x-2 xl:space-x-3">
                    <span class="hidden 2xl:inline text-xs font-semibold text-slate-400 uppercase tracking-wider">Preview:</span>
                    <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
                        <button onclick="app.setPreviewMode('theme')" id="pm-theme" class="px-2.5 py-1 rounded bg-slate-700 text-white font-medium transition flex items-center space-x-1.5" title="WYSIWYG preview rendered with the exported theme CSS"><i class="fa-solid fa-eye"></i><span class="hidden lg:inline">Blog Preview</span></button>
                        <button onclick="app.setPreviewMode('layout')" id="pm-layout" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition flex items-center space-x-1.5" title="Blogger-style Layout page with sections and gadgets"><i class="fa-solid fa-table-columns"></i><span class="hidden lg:inline">Blogger Layout</span></button>
                    </div>

                    <div class="flex items-center space-x-1 border-l border-slate-600 pl-2 ml-2">
                        <span class="hidden sm:inline text-xs font-semibold text-slate-400 uppercase tracking-wider">Panels:</span>
                        <button onclick="app.togglePanel('left')" id="panel-toggle-left" class="px-2 py-1 rounded text-xs font-medium text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-700 transition flex items-center space-x-1" title="Hide/show left panel (gadgets)"><i class="fa-solid fa-chevron-left"></i><span class="hidden sm:inline">Left</span></button>
                        <button onclick="app.togglePanel('right')" id="panel-toggle-right" class="px-2 py-1 rounded text-xs font-medium text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-700 transition flex items-center space-x-1" title="Hide/show right panel (inspector)"><i class="fa-solid fa-chevron-right"></i><span class="hidden sm:inline">Right</span></button>
                    </div>
                    <span class="hidden 2xl:inline text-xs font-semibold text-slate-400 uppercase tracking-wider">Page:</span>
                    <div id="page-type-group" class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs transition-opacity duration-200">
                        <button onclick="app.setPageType('index')" id="pt-index" class="px-2.5 py-1 rounded bg-slate-700 text-white font-medium transition">Homepage</button>
                        <button onclick="app.setPageType('item')" id="pt-item" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition">Post Detail</button>
                        <button onclick="app.setPageType('archive')" id="pt-archive" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition">Archive</button>
                        <button onclick="app.setPageType('static_page')" id="pt-static_page" class="px-2.5 py-1 rounded text-slate-400 hover:text-white transition">Static Page</button>
                    </div>
                </div>

                <div class="flex items-center space-x-2 text-xs text-slate-400">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="canvas-mode-state">Live 1:1 Schema Synchronized</span>
                </div>
            </div>

            <div class="flex-1 overflow-auto p-4 md:p-8 flex items-center justify-center bg-slate-950/80 custom-scrollbar">
                <div id="canvas-viewport-frame" class="bg-white text-slate-900 shadow-2xl rounded-xl overflow-hidden transition-all duration-300 w-full max-w-[1440px] h-full flex flex-col border border-slate-700">
                    <div id="canvas-root" class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar relative"></div>
                </div>
            </div>
        </main>

        <!-- RIGHT PANEL: Properties Inspector -->
        <aside id="right-panel" class="w-80 bg-slate-800 border-l border-slate-700 flex flex-col z-20 shrink-0">
            <div class="h-12 bg-slate-900 border-b border-slate-700 px-4 flex items-center justify-between">
                <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center">
                    <i class="fa-solid fa-sliders text-blogger-orange mr-2"></i> Properties Inspector
                </h3>
                <span id="selected-item-badge" class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded">No selection</span>
            </div>
            <div id="right-panel-content" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4 text-sm"></div>
        </aside>

    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>
    <div id="modal-container" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4"></div>

    <script>
        const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => HTML_ESCAPES[ch]);

        const OPEN_BODY_TAG = '<' + 'body>';
        const CLOSE_HEAD_TAG = '</' + 'head>';
        const CLOSE_BODY_TAG = '</' + 'body>';
        const CLOSE_HTML_TAG = '</' + 'html>';

        const DEFAULT_CUSTOMIZER = {
            colors: {
                primary: '#F57C00',
                secondary: '#1A73E8',
                background: '#FFFFFF',
                surface: '#F8F9FA',
                text: '#202124',
                muted: '#5F6368',
                border: '#DADCE0',
                links: '#1A73E8'
            },
            typography: {
                fontFamily: "'Inter', sans-serif",
                headingSize: '32px',
                bodySize: '15px',
                mainWidth: '100%',
                postWidth: '60%',
                sidebarLeftWidth: '20%',
                sidebarRightWidth: '20%'
            }
        };

        const NATIVE_WIDGET_REGISTRY = {
            Header: { idPrefix: 'Header', version: 2, defaultTitle: 'Blog Header', icon: 'fa-heading', desc: 'Blog title, description, and logo banner.', defaults: { description: '', showImage: false, imageLogo: '' } },
            Blog: { idPrefix: 'Blog', version: 2, defaultTitle: 'Blog Posts', icon: 'fa-newspaper', desc: 'Main post stream, pagination, and comments.', defaults: { postsPerPage: 6, showAuthor: true, showTimestamp: true, showLabels: true, readMoreText: 'Continue Reading →' } },
            PageList: { idPrefix: 'PageList', version: 2, defaultTitle: 'Pages', icon: 'fa-bars', desc: 'Top navigation bar for static pages.', defaults: { showHome: true, pages: ['Home', 'About'] } },
            PopularPosts: { idPrefix: 'PopularPosts', version: 2, defaultTitle: 'Popular Posts', icon: 'fa-fire', desc: 'Displays most viewed posts with thumbnails.', defaults: { maxPosts: 4, showThumbnail: true, showSnippet: false } },
            Label: { idPrefix: 'Label', version: 2, defaultTitle: 'Labels', icon: 'fa-tags', desc: 'Categorized label cloud or list with counts.', defaults: { displayMode: 'cloud', showCount: true } },
            BlogArchive: { idPrefix: 'BlogArchive', version: 2, defaultTitle: 'Blog Archive', icon: 'fa-box-archive', desc: 'Chronological archive tree of blog posts.', defaults: { hierarchy: 'tree' } },
            Profile: { idPrefix: 'Profile', version: 2, defaultTitle: 'About Me', icon: 'fa-user', desc: 'Author profile card and bio.', defaults: { bio: 'Editor of TechPulse Daily. Writing about web platforms, publishing tools, and developer workflows.' } },
            HTML: { idPrefix: 'HTML', version: 2, defaultTitle: 'HTML / JavaScript', icon: 'fa-code', desc: 'Custom HTML snippets, banners, or widgets.', defaults: { content: '' } },
            Image: { idPrefix: 'Image', version: 2, defaultTitle: 'Image Gadget', icon: 'fa-image', desc: 'Display a responsive image with link.', defaults: { imageUrl: '', imageLink: '', altText: '' } },
            LinkList: { idPrefix: 'LinkList', version: 2, defaultTitle: 'Blogroll / Links', icon: 'fa-link', desc: 'Curated list of external or internal links.', defaults: { links: [] } },
            BlogSearch: { idPrefix: 'BlogSearch', version: 2, defaultTitle: 'Blog Search', icon: 'fa-magnifying-glass', desc: 'Live search box for blog entries.', defaults: { placeholder: 'Search articles...' } },
            Attribution: { idPrefix: 'Attribution', version: 2, defaultTitle: 'Attribution', icon: 'fa-copyright', desc: 'Copyright and template credits.', defaults: { creditText: 'Powered by Blogger.' } },
            ContactForm: { idPrefix: 'ContactForm', version: 2, defaultTitle: 'Contact Form', icon: 'fa-envelope', desc: 'Visitor contact form widget.', defaults: {} },
            FeaturedPost: { idPrefix: 'FeaturedPost', version: 2, defaultTitle: 'Featured Post', icon: 'fa-star', desc: 'Highlight a key article prominently.', defaults: { snippetLength: 180, showThumbnail: true } },
            ReportAbuse: { idPrefix: 'ReportAbuse', version: 2, defaultTitle: 'Report Abuse', icon: 'fa-flag', desc: 'Standard Blogger report abuse link.', defaults: {} }
        };

        const SECTION_TYPE_LABELS = {
            header: 'Header Section',
            navigation: 'Navigation Section',
            featured: 'Featured Section',
            main: 'Main Content Section',
            'sidebar-left': 'Left Sidebar Section',
            'sidebar-right': 'Right Sidebar Section',
            sidebar: 'Sidebar Section (Legacy)',
            footer: 'Footer Section'
        };

        const WIDGETS_WITHOUT_TITLE = ['Header', 'Blog', 'PageList', 'Attribution', 'ReportAbuse', 'ContactForm'];
        const SAMPLE_POSTS = [
            { title: 'Mastering Native Blogger Template Architecture', snippet: 'Discover advanced strategies for compiling canonical JSON schemas directly into valid Blogger XML templates without SAX errors.' },
            { title: 'Designing a 1:1 Preview Pipeline with Shadow DOM', snippet: 'Isolate exported theme CSS from the builder shell so what you see locally is exactly what Blogger renders after upload.' },
            { title: 'Why Layout Sections Still Matter in 2026', snippet: 'Sections keep gadgets addressable, reorderable, and safe to move between the main column and the sidebar.' },
            { title: 'Shipping a Fast Blogspot Theme', snippet: 'Practical rules for trimming CSS, deferring scripts, and keeping the theme installable across layouts versions.' },
            { title: 'A Practical Guide to Blogger Data Tags', snippet: 'Learn which tags are valid inside Header, Blog, PageList, and LinkList widgets before you upload.' },
            { title: 'Building a Theme Customizer That Survives Export', snippet: 'Keep colors and typography in one source of truth that drives both the preview canvas and the b:skin block.' }
        ];

        const SAMPLE_ARCHIVE_MONTHS = [
            { label: 'October 2026', count: 12 },
            { label: 'September 2026', count: 8 },
            { label: 'August 2026', count: 15 },
            { label: 'July 2026', count: 6 }
        ];

        const SAMPLE_LABELS = [
            { name: 'Technology', count: 12 },
            { name: 'Gadgets', count: 8 },
            { name: 'AI & ML', count: 5 },
            { name: 'Web Design', count: 9 },
            { name: 'Blogger', count: 3 },
            { name: 'Tutorials', count: 7 }
        ];

        class BloggerThemeBuilderPro {
            constructor() {
                this.history = [];
                this.historyIndex = -1;
                this.selectedId = null;
                this.selectedSectionId = null;
                this.pendingAction = null;
                this.currentViewport = 'desktop';
                this.activeTab = 'elements';
                this.previewMode = 'theme';
                this.panelLeftHidden = false;
                this.panelRightHidden = false;

                this.schema = {
                    metadata: {
                        name: 'Modern Mag Pro v2.6',
                        version: '2.6.0',
                        author: 'Blogger Theme Studio Pro',
                        description: 'Professional 1:1 Synchronized Blogger Theme Schema'
                    },
                    customizer: JSON.parse(JSON.stringify(DEFAULT_CUSTOMIZER)),
                    sections: [
                        { id: 'header-sec', name: 'Header Section', type: 'header', widgets: [
                            { id: 'Header1', type: 'Header', title: 'TechPulse Daily', settings: { description: 'Professional Magazine & Technology Journal', showImage: true, imageLogo: 'https://placehold.co/180x50/F57C00/FFFFFF?text=TechPulse' } }
                        ]},
                        { id: 'nav-sec', name: 'Navigation Section', type: 'navigation', widgets: [
                            { id: 'PageList1', type: 'PageList', title: 'Pages', settings: { showHome: true, pages: ['Home', 'Technology', 'Gadgets', 'Reviews', 'Contact'] } }
                        ]},
                        { id: 'featured-sec', name: 'Featured Section', type: 'featured', widgets: [
                            { id: 'FeaturedPost1', type: 'FeaturedPost', title: 'Editor\u2019s Pick', settings: { snippetLength: 180, showThumbnail: true } }
                        ]},
                        { id: 'main-sec', name: 'Main Content Section', type: 'main', widgets: [
                            { id: 'Blog1', type: 'Blog', title: 'Blog Posts', settings: { postsPerPage: 6, showAuthor: true, showTimestamp: true, showLabels: true, readMoreText: 'Continue Reading →' } }
                        ]},
                        { id: 'sidebar-left-sec', name: 'Left Sidebar Section', type: 'sidebar-left', widgets: [
                            { id: 'PopularPosts1', type: 'PopularPosts', title: 'Trending Articles', settings: { maxPosts: 4, showThumbnail: true, showSnippet: false } },
                            { id: 'Label1', type: 'Label', title: 'Categories', settings: { displayMode: 'cloud', showCount: true } }
                        ]},
                        { id: 'sidebar-right-sec', name: 'Right Sidebar Section', type: 'sidebar-right', widgets: [
                            { id: 'BlogSearch1', type: 'BlogSearch', title: 'Search Blog', settings: { placeholder: 'Search articles...' } },
                            { id: 'BlogArchive1', type: 'BlogArchive', title: 'Archives', settings: { hierarchy: 'tree' } }
                        ]},
                        { id: 'footer-sec', name: 'Footer Section', type: 'footer', widgets: [
                            { id: 'LinkList1', type: 'LinkList', title: 'Quick Links', settings: { links: [{ name: 'Privacy Policy', url: '#' }, { name: 'Terms of Use', url: '#' }] } },
                            { id: 'Attribution1', type: 'Attribution', title: 'Attribution', settings: { creditText: 'Designed with Blogger Theme Builder Pro.' } }
                        ]}
                    ],
                    activePageType: 'index'
                };

                this.init();
            }

            init() {
                this.saveState();
                this.renderAll();
                this.setupEventListeners();
                this.showToast('Blogger Theme Builder Pro ready. Select a gadget to edit its properties.', 'success');
            }

            saveState() {
                if (this.historyIndex < this.history.length - 1) {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                }
                this.history.push(JSON.parse(JSON.stringify(this.schema)));
                if (this.history.length > 60) {
                    this.history.shift();
                }
                this.historyIndex = this.history.length - 1;
            }

            undo() {
                if (this.historyIndex <= 0) {
                    this.showToast('Nothing to undo.', 'info');
                    return;
                }
                this.historyIndex--;
                this.schema = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                this.normalizeSelection();
                this.renderAll();
                this.showToast('Action undone.', 'info');
            }

            redo() {
                if (this.historyIndex >= this.history.length - 1) {
                    this.showToast('Nothing to redo.', 'info');
                    return;
                }
                this.historyIndex++;
                this.schema = JSON.parse(JSON.stringify(this.history[this.historyIndex]));
                this.normalizeSelection();
                this.renderAll();
                this.showToast('Action redone.', 'info');
            }

            normalizeSelection() {
                if (this.selectedId && !this.findWidget(this.selectedId)) {
                    this.selectedId = null;
                    this.selectedSectionId = null;
                }
                if (this.selectedSectionId && !this.schema.sections.some((sec) => sec.id === this.selectedSectionId)) {
                    this.selectedSectionId = null;
                }
            }

            switchTab(tabName) {
                this.activeTab = tabName;
                ['elements', 'layout', 'customizer', 'xml'].forEach((tab) => {
                    const btn = document.getElementById(`tab-btn-${tab}`);
                    if (!btn) return;
                    const active = tab === tabName;
                    btn.className = active
                        ? 'py-2 font-medium text-slate-200 bg-slate-800 rounded transition flex flex-col items-center justify-center'
                        : 'py-2 font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center';
                    const icon = btn.querySelector('i');
                    if (icon) icon.classList.toggle('text-blogger-orange', active);
                });
                this.renderLeftPanel();
            }

            setViewport(viewport) {
                this.currentViewport = viewport;
                const frame = document.getElementById('canvas-viewport-frame');
                ['desktop', 'tablet', 'mobile'].forEach((vp) => {
                    const btn = document.getElementById(`vp-${vp}`);
                    if (!btn) return;
                    btn.className = vp === viewport
                        ? 'px-3 py-1 rounded text-xs font-medium text-slate-200 bg-slate-700 shadow transition flex items-center space-x-1.5'
                        : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition flex items-center space-x-1.5';
                });
                if (!frame) return;
                if (viewport === 'tablet') frame.style.maxWidth = '768px';
                else if (viewport === 'mobile') frame.style.maxWidth = '375px';
                else frame.style.maxWidth = '1440px';
            }

            setPageType(pageType) {
                this.schema.activePageType = pageType;
                ['index', 'item', 'archive', 'static_page'].forEach((pt) => {
                    const btn = document.getElementById(`pt-${pt}`);
                    if (!btn) return;
                    btn.className = pt === pageType
                        ? 'px-2.5 py-1 rounded bg-slate-700 text-white font-medium transition'
                        : 'px-2.5 py-1 rounded text-slate-400 hover:text-white transition';
                });
                this.renderCanvas();
            }

            setPreviewMode(mode) {
                this.previewMode = mode === 'layout' ? 'layout' : 'theme';
                ['theme', 'layout'].forEach((m) => {
                    const btn = document.getElementById(`pm-${m}`);
                    if (!btn) return;
                    btn.className = m === this.previewMode
                        ? 'px-2.5 py-1 rounded bg-slate-700 text-white font-medium transition flex items-center space-x-1.5'
                        : 'px-2.5 py-1 rounded text-slate-400 hover:text-white transition flex items-center space-x-1.5';
                });
                const pageGroup = document.getElementById('page-type-group');
                if (pageGroup) {
                    pageGroup.classList.toggle('opacity-40', this.previewMode === 'layout');
                    pageGroup.classList.toggle('pointer-events-none', this.previewMode === 'layout');
                }
                const state = document.getElementById('canvas-mode-state');
                if (state) {
                    state.textContent = this.previewMode === 'layout'
                        ? 'Blogger Layout · Tata Letak'
                        : 'Live 1:1 Schema Synchronized';
                }
                this.renderCanvas();
            }

            togglePanel(side) {
                if (side === 'left') {
                    this.panelLeftHidden = !this.panelLeftHidden;
                    const panel = document.getElementById('left-panel');
                    const btn = document.getElementById('panel-toggle-left');
                    if (panel) panel.classList.toggle('hidden', this.panelLeftHidden);
                    if (btn) {
                        btn.innerHTML = this.panelLeftHidden
                            ? '<i class="fa-solid fa-chevron-right"></i><span class="hidden sm:inline">Show Left</span>'
                            : '<i class="fa-solid fa-chevron-left"></i><span class="hidden sm:inline">Left</span>';
                        btn.title = this.panelLeftHidden
                            ? 'Show left panel (gadgets)'
                            : 'Hide left panel (gadgets)';
                        btn.className = this.panelLeftHidden
                            ? 'px-2 py-1 rounded text-xs font-medium text-emerald-400 hover:text-white bg-emerald-600/20 transition flex items-center space-x-1'
                            : 'px-2 py-1 rounded text-xs font-medium text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-700 transition flex items-center space-x-1';
                    }
                } else {
                    this.panelRightHidden = !this.panelRightHidden;
                    const panel = document.getElementById('right-panel');
                    const btn = document.getElementById('panel-toggle-right');
                    if (panel) panel.classList.toggle('hidden', this.panelRightHidden);
                    if (btn) {
                        btn.innerHTML = this.panelRightHidden
                            ? '<i class="fa-solid fa-chevron-left"></i><span class="hidden sm:inline">Show Right</span>'
                            : '<i class="fa-solid fa-chevron-right"></i><span class="hidden sm:inline">Right</span>';
                        btn.title = this.panelRightHidden
                            ? 'Show right panel (inspector)'
                            : 'Hide right panel (inspector)';
                        btn.className = this.panelRightHidden
                            ? 'px-2 py-1 rounded text-xs font-medium text-emerald-400 hover:text-white bg-emerald-600/20 transition flex items-center space-x-1'
                            : 'px-2 py-1 rounded text-xs font-medium text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-700 transition flex items-center space-x-1';
                    }
                }
            }

            renderAll() {
                this.renderLeftPanel();
                this.renderCanvas();
                this.renderPropertiesInspector();
            }

            renderLeftPanel() {
                const container = document.getElementById('left-tab-content');
                if (!container) return;
                const scrollTop = container.scrollTop;
                if (this.activeTab === 'layout') container.innerHTML = this.renderLayoutPanel();
                else if (this.activeTab === 'customizer') container.innerHTML = this.renderCustomizerPanel();
                else if (this.activeTab === 'xml') container.innerHTML = this.renderXmlPanel();
                else container.innerHTML = this.renderElementsPanel();
                if (this.activeTab === 'xml') this.compileBloggerXML();
                container.scrollTop = scrollTop;
            }

            renderElementsPanel() {
                let html = `<div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Blogger Native Gadgets</div>`;
                html += `<p class="text-[11px] text-slate-400 mb-3">Click a gadget to add it to the most suitable section. Select any gadget afterwards to edit its settings.</p>`;
                html += `<div class="grid grid-cols-1 gap-2">`;
                for (const [type, info] of Object.entries(NATIVE_WIDGET_REGISTRY)) {
                    html += `
                        <div onclick="app.addWidget('${type}')" class="bg-slate-900 hover:bg-slate-700/80 border border-slate-700 hover:border-blogger-orange p-2.5 rounded-lg cursor-pointer transition flex items-center justify-between group">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-8 h-8 rounded bg-slate-800 text-blogger-orange flex items-center justify-center group-hover:bg-blogger-orange group-hover:text-white transition">
                                    <i class="fa-solid ${info.icon}"></i>
                                </div>
                                <div>
                                    <div class="text-xs font-semibold text-slate-200">${escapeHtml(info.defaultTitle)}</div>
                                    <div class="text-[10px] text-slate-400 truncate max-w-[160px]">${escapeHtml(info.desc)}</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-plus text-xs text-slate-500 group-hover:text-white"></i>
                        </div>
                    `;
                }
                html += `</div>`;
                return html;
            }

            renderLayoutPanel() {
                let html = `<div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Blogger Layout Sections</span>
                    <button onclick="app.promptAddSection()" class="text-[11px] bg-blogger-orange hover:bg-blogger-darkorange text-white px-2 py-1 rounded transition"><i class="fa-solid fa-plus mr-1"></i> Section</button>
                </div>`;
                html += `<p class="text-[11px] text-slate-400 mb-3">Reorder gadgets and sections. Sidebar sections are grouped into the left/right columns; the canvas and exported XML use the same column order.</p>`;
                html += `<div class="space-y-3">`;

                this.schema.sections.forEach((sec, idx) => {
                    html += `
                        <div class="bg-slate-900 border ${this.selectedSectionId === sec.id ? 'border-blogger-orange' : 'border-slate-700'} rounded-lg p-2.5">
                            <div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-slate-800">
                                <div class="min-w-0">
                                    <div class="text-xs font-bold text-blogger-orange uppercase truncate">${escapeHtml(sec.name)}</div>
                                    <div class="text-[10px] text-slate-400 font-mono truncate">#${escapeHtml(sec.id)} · ${sec.widgets.length} gadget(s)</div>
                                </div>
                                <div class="flex items-center space-x-1 shrink-0">
                                    ${idx > 0 ? `<button onclick="app.moveSection(${idx}, -1)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs" title="Move section up"><i class="fa-solid fa-chevron-up"></i></button>` : ''}
                                    ${idx < this.schema.sections.length - 1 ? `<button onclick="app.moveSection(${idx}, 1)" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs" title="Move section down"><i class="fa-solid fa-chevron-down"></i></button>` : ''}
                                    <button onclick="app.promptAddWidgetToSection('${sec.id}')" class="w-6 h-6 rounded bg-slate-800 hover:bg-emerald-600 text-slate-300 hover:text-white flex items-center justify-center text-xs" title="Add gadget"><i class="fa-solid fa-plus"></i></button>
                                    <button onclick="app.removeSection('${sec.id}')" class="w-6 h-6 rounded bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white flex items-center justify-center text-xs" title="Delete section"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="space-y-1.5">
                    `;

                    if (sec.widgets.length === 0) {
                        html += `<div class="text-[11px] text-slate-500 italic p-1">No gadgets in this section yet.</div>`;
                    } else {
                        sec.widgets.forEach((widget, widgetIdx) => {
                            const info = NATIVE_WIDGET_REGISTRY[widget.type];
                            html += `
                                <div onclick="app.selectWidget('${widget.id}')" class="flex items-center justify-between gap-2 bg-slate-800/80 hover:bg-slate-700 p-2 rounded cursor-pointer border ${this.selectedId === widget.id ? 'border-blogger-orange' : 'border-slate-700/60'}">
                                    <div class="flex items-center space-x-2 min-w-0">
                                        <i class="fa-solid ${info ? info.icon : 'fa-puzzle-piece'} text-blogger-orange text-xs"></i>
                                        <span class="text-xs text-slate-200 font-medium truncate">${escapeHtml(widget.title)}</span>
                                        <span class="text-[10px] text-slate-400 font-mono truncate">(${escapeHtml(widget.id)})</span>
                                    </div>
                                    <div class="flex items-center space-x-1 shrink-0">
                                        ${widgetIdx > 0 ? `<button onclick="event.stopPropagation(); app.moveWidget('${sec.id}', ${widgetIdx}, -1)" class="text-slate-400 hover:text-white px-1" title="Move up"><i class="fa-solid fa-caret-up"></i></button>` : ''}
                                        ${widgetIdx < sec.widgets.length - 1 ? `<button onclick="event.stopPropagation(); app.moveWidget('${sec.id}', ${widgetIdx}, 1)" class="text-slate-400 hover:text-white px-1" title="Move down"><i class="fa-solid fa-caret-down"></i></button>` : ''}
                                        <button onclick="event.stopPropagation(); app.removeWidget('${sec.id}', '${widget.id}')" class="text-red-400 hover:text-red-300 px-1" title="Delete gadget"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += `</div></div>`;
                });

                html += `</div>`;
                return html;
            }

            renderCustomizerPanel() {
                const c = this.schema.customizer.colors;
                const t = this.schema.customizer.typography;
                const colorFields = [
                    ['primary', 'Primary'],
                    ['secondary', 'Secondary'],
                    ['background', 'Background'],
                    ['surface', 'Surface'],
                    ['text', 'Text'],
                    ['muted', 'Muted Text'],
                    ['border', 'Border'],
                    ['links', 'Links']
                ];

                let html = `<div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Global Theme Customizer</div>`;
                html += `<div class="space-y-4">
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-3">
                        <div class="text-xs font-bold text-slate-200">Color Palette</div>
                        <div class="grid grid-cols-2 gap-3 text-xs">
                `;

                colorFields.forEach(([key, label]) => {
                    html += `
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">${label}</label>
                            <div class="flex items-center space-x-2">
                                <input type="color" value="${c[key]}" onchange="app.updateColor('${key}', this.value)" class="w-6 h-6 rounded border-0 cursor-pointer bg-transparent">
                                <span class="font-mono text-[11px] text-slate-300">${escapeHtml(c[key])}</span>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-3">
                        <div class="text-xs font-bold text-slate-200">Typography &amp; Dimensions</div>
                        <div class="space-y-2 text-xs">
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Font Family</label>
                                <select onchange="app.updateTypography('fontFamily', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200">
                                    <option value="'Inter', sans-serif" ${t.fontFamily.includes('Inter') ? 'selected' : ''}>Inter (Modern Sans)</option>
                                    <option value="'Playfair Display', serif" ${t.fontFamily.includes('Playfair') ? 'selected' : ''}>Playfair Display (Editorial)</option>
                                    <option value="system-ui, sans-serif" ${t.fontFamily.includes('system-ui') ? 'selected' : ''}>System Default</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] text-slate-400 block mb-1">Heading Size</label>
                                    <input type="text" value="${escapeHtml(t.headingSize)}" onchange="app.updateTypography('headingSize', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 block mb-1">Body Size</label>
                                    <input type="text" value="${escapeHtml(t.bodySize)}" onchange="app.updateTypography('bodySize', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Main Container Width</label>
                                <input type="text" value="${escapeHtml(t.mainWidth)}" onchange="app.updateTypography('mainWidth', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">Post Column Width</label>
                                <input type="text" value="${escapeHtml(t.postWidth)}" onchange="app.updateTypography('postWidth', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] text-slate-400 block mb-1">Left Sidebar</label>
                                    <input type="text" value="${escapeHtml(t.sidebarLeftWidth)}" onchange="app.updateTypography('sidebarLeftWidth', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 block mb-1">Right Sidebar</label>
                                    <input type="text" value="${escapeHtml(t.sidebarRightWidth)}" onchange="app.updateTypography('sidebarRightWidth', this.value)" class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-slate-200 font-mono">
                                </div>
                            </div>
                            <p class="text-[10px] text-slate-500">Default three-column ratio: left 20% / post 60% / right 20%. When one sidebar is empty, the post column fills the remaining space.</p>
                        </div>
                    </div>
                    <button onclick="app.resetCustomizer()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded text-xs font-semibold transition">Reset Palette &amp; Typography</button>
                </div>`;

                return html;
            }

            renderXmlPanel() {
                return `<div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Blogger XML Compiler</div>
                    <p class="text-[11px] text-slate-400 mb-3">Live canonical Blogger XML generated from the active schema. Export or copy it straight into Blogger.</p>
                    <button onclick="app.compileBloggerXML()" class="w-full bg-blogger-orange hover:bg-blogger-darkorange text-white py-2 rounded text-xs font-semibold shadow transition mb-3">Re-compile XML Source</button>
                    <div class="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                        <span>Output preview</span>
                        <span id="xml-meta" class="font-mono">—</span>
                    </div>
                    <pre id="xml-quick-preview" class="bg-slate-900 border border-slate-700 rounded p-2 text-[10px] code-font text-emerald-400 h-72 overflow-auto custom-scrollbar whitespace-pre select-text"></pre>`;
            }

            getSidebarSections() {
                const left = [];
                const right = [];
                this.schema.sections.forEach((sec) => {
                    if (sec.type === 'sidebar-left') {
                        left.push(sec);
                    } else if (sec.type === 'sidebar-right' || sec.type === 'sidebar') {
                        right.push(sec);
                    }
                });
                return { left, right };
            }

            isSidebarType(type) {
                return type === 'sidebar' || type === 'sidebar-left' || type === 'sidebar-right';
            }

            buildContentColumns() {
                const { left, right } = this.getSidebarSections();
                const tracks = [];
                if (left.length) tracks.push('minmax(0, var(--sidebar-left-width, 20%))');
                tracks.push(left.length && right.length ? 'minmax(0, var(--post-width, 60%))' : 'minmax(0, 1fr)');
                if (right.length) tracks.push('minmax(0, var(--sidebar-right-width, 20%))');
                return tracks.join(' ');
            }

            buildThemeCSS(rootSelector = 'body', breakpoint = '@media (max-width: 600px)') {
                const c = this.schema.customizer.colors;
                const t = this.schema.customizer.typography;
                return `
        ${rootSelector} {
            --primary-color: ${c.primary};
            --secondary-color: ${c.secondary};
            --bg-color: ${c.background};
            --surface-color: ${c.surface};
            --text-color: ${c.text};
            --muted-color: ${c.muted};
            --border-color: ${c.border};
            --link-color: ${c.links};
            --font-family: ${t.fontFamily};
            --heading-size: ${t.headingSize};
            --body-size: ${t.bodySize};
            --main-width: ${t.mainWidth};
            --post-width: ${t.postWidth};
            --sidebar-left-width: ${t.sidebarLeftWidth};
            --sidebar-right-width: ${t.sidebarRightWidth};
            --sidebar-width: ${t.sidebarRightWidth};
            --column-space: clamp(16px, 2.5vw, 32px);
            margin: 0;
            padding: 0;
            width: auto;
            max-width: 100%;
            font-family: var(--font-family);
            font-size: var(--body-size);
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }
        html { width: auto; max-width: 100%; overflow-x: hidden; }
        *, *::before, *::after { box-sizing: border-box; }
        img { max-width: 100%; height: auto; }
        iframe, video, embed, object, table { max-width: 100%; }
        pre { max-width: 100%; overflow-x: auto; }
        input, textarea, select, button { max-width: 100%; }
        a { color: var(--link-color); }
        h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 12px; }
        h1 { font-size: var(--heading-size); }
        .main-wrapper, .footer-wrapper { width: 100%; max-width: 100%; min-width: 0; margin: 0 auto; overflow-x: hidden; }
        .main-wrapper { max-width: var(--main-width); max-width: min(100%, var(--main-width)); }
        .section-wrap { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; overflow-x: hidden; }
        .section-wrap > .section, .section-wrap > .section > .widget, .section-wrap > .section > .widget > .widget-content { width: auto; max-width: 100%; min-width: 0; box-sizing: border-box; }
        .section-wrap > .section { margin: 0; padding: 0; }
        .content-container, .posts-col, .sidebar-left-col, .sidebar-right-col, .sidebar-col, .blog-posts, .post-item, .post-body, .blog-header-inner, .blog-heading, .featured-post, .popular-posts, .page-list, .link-list, .label-list, .archive-list, .blog-search-form, .contact-form-widget, .profile-widget, .html-widget-body, .image-widget, .attribution, .standard-widget-body { box-sizing: border-box; max-width: 100%; min-width: 0; }
        .blog-header-inner > *, .content-container > *, .section-navigation ul > *, .section-footer > .section > * { min-width: 0; max-width: 100%; }
        .widget-content > *, .post-body > * { max-width: 100%; }
        @supports (overflow: clip) {
            html, ${rootSelector}, .main-wrapper, .footer-wrapper, .section-wrap { overflow-x: clip; }
        }
        ${this.buildLayoutGuardCSS()}
        .section-wrap.section-header { background-color: var(--surface-color); border-bottom: 1px solid var(--border-color); padding: 20px 24px; }
        .blog-header-inner { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }

        .blog-logo { height: 40px; width: auto; object-fit: contain; }
        .blog-title { font-size: var(--heading-size); color: var(--primary-color); text-decoration: none; margin: 0; }
        .blog-description { margin: 4px 0 0; font-size: 13px; color: var(--muted-color); }
        .section-wrap.section-navigation { background-color: #202124; color: #ffffff; padding: 12px 24px; }
        .section-navigation .widget-content { margin-bottom: 0; }
        .section-navigation ul { display: flex; flex-wrap: wrap; gap: 20px; margin: 0; padding: 0; list-style: none; }
        .section-navigation a { color: #ffffff; text-decoration: none; font-size: 13px; }
        .section-navigation a:hover { color: var(--primary-color); }
        .section-wrap.section-footer { background-color: #202124; color: #9aa0a6; padding: 28px 24px; font-size: 13px; }
        .section-wrap.section-footer > .section { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
        .section-footer .widget-content { margin-bottom: 0; }
        .section-footer a { color: #cbd5e1; text-decoration: none; }
        .section-footer a:hover { color: #ffffff; }
        .content-container { display: grid; width: 100%; max-width: 100%; min-width: 0; grid-template-columns: ${this.buildContentColumns()}; gap: 0; padding: 28px 16px; align-items: start; }
        .posts-col { width: 100%; max-width: 100%; min-width: 0; padding: 0 var(--column-space); }
        .sidebar-left-col, .sidebar-right-col, .sidebar-col { width: 100%; max-width: 100%; min-width: 0; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
        .post-item { background-color: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .post-item:last-child { margin-bottom: 0; }

        .popular-post { display: flex; align-items: center; gap: 10px; }
        .popular-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: 0 0 56px; }
        .popular-post a { text-decoration: none; font-size: 13px; }
        .label-link { display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 999px; font-size: 12px; text-decoration: none; background-color: #ffffff; }

        .profile-name { font-weight: 600; font-size: 13px; }
        .profile-widget p { margin: 0; font-size: 12px; color: var(--muted-color); }
        .image-widget img { display: block; width: 100%; border-radius: 8px; }
        .html-widget-body { font-size: 13px; }
        .attribution { font-size: 12px; }
        .contact-form-widget { display: flex; flex-direction: column; gap: 8px; }
        .contact-form-widget input, .contact-form-widget textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 13px; }

            renderCanvas() {

                root.scrollTop = scrollTop;
                this.bindCanvasEvents(shadow);
                this.applySelectionHighlight();

            bindCanvasEvents(shadow) {
                if (shadow.__btbpBound) return;
                shadow.__btbpBound = true;
                shadow.addEventListener('click', (event) => {

                    if (anchor) event.preventDefault();
